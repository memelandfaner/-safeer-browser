name: Preverbe

# Prve samodejne preverbe za ta repozitorij. Tecejo brez Android SDK, zato so
# gotove v nekaj sekundah in nic ne stanejo.
#
#  1. prevodi  -- jezik, ki zaostaja za privzetim, bi uporabniku pokazal prazno
#                 polje ali slovenscino. To smo doslej iskali rocno.
#  2. zaznavalnik -- sivi plakat pred videom je bil popravljen; ta preverba pazi,
#                 da zaznavalnik, s katerim ga merimo na telefonu in tablici, se
#                 vedno prepozna pravi posnetek zaslona pred popravkom. Ce ga kdo
#                 omehca, pade.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preverbe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Vsak jezik mora imeti vse kljuce
        run: python3 tools/preveri-prevode.py .

      - name: Pillow za branje posnetkov zaslona
        run: python3 -m pip install --quiet Pillow

      - name: Zaznavalnik mora prepoznati hrosca
        run: python3 -m unittest discover -s tests -p 'test_zaznaj.py' -v
