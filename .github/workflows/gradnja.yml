name: Gradnja

# Doslej se je ta brskalnik prevajal samo na enem prenosniku. Ce bi se prevajanje
# pokvarilo, tega ne bi opazil nihce do naslednje izdaje.
#
# Ta tek zgradi NEPODPISAN APK: viri, Kotlin, DEX, paket. Podpisni kljuc ostane
# doma in ga tu ni. Namen ni izdelati paketa za uporabnike, ampak dokazati, da
# se koda prevede.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (aapt2, d8, android.jar)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Kotlin 1.9.24 (ista razlicica kot doma, pripeta kontrolna vsota)
        run: |
          curl -fsSL -o /tmp/kotlinc.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip
          echo "eb7b68e01029fa67bc8d060ee54c12018f2c60ddc438cf21db14517229aa693b  /tmp/kotlinc.zip" | sha256sum -c -
          unzip -q /tmp/kotlinc.zip -d /tmp

      - name: Pravila blokiranja in skrivanja (motor brez Androida)
        env:
          KOTLINC: /tmp/kotlinc/bin/kotlinc
        run: bash tools/preveri-motor.sh

      - name: Celotni regresijski testi (DNS, prijave, podpisi, seznami in zavihki)
        env:
          KOTLINC: /tmp/kotlinc/bin/kotlinc
        run: ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar" bash tests/run_tests.sh

      - name: Nepodpisan APK (brez kljuca)
        env:
          KOTLINC: /tmp/kotlinc/bin/kotlinc
        run: bash tools/gradnja-ci.sh

      - name: Shrani za pregled
        uses: actions/upload-artifact@v7
        with:
          name: nepodpisan-apk
          path: build-ci/nepodpisan.apk
          retention-days: 7
